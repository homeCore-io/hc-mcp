[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hc-mcp"
version = "0.1.0"
description = "Model Context Protocol server for homeCore"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "John Eubanks", email = "john@eubanks.io" }]

dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
hc-mcp = "hc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["hc_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
