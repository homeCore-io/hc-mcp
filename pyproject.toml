[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hc-mcp"
version = "0.2.0"
description = "Model Context Protocol server for homeCore, and its in-app Assistant"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "John Eubanks", email = "john@eubanks.io" }]

dependencies = [
    # <2 is a real constraint, not caution. mcp 2.0 removed
    # `mcp.server.fastmcp` (FastMCP became MCPServer under
    # mcp.server.mcpserver), so every module here fails to import against it.
    # `mcp>=1.0` had already started resolving to 2.0 — a fresh install of this
    # package produced a server that could not start. Lift the pin only
    # together with the port to the 2.x API.
    "mcp>=1.0,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "websockets>=12.0",
    # The in-app chat's model. 2.x is built on httpx2, so it does not share
    # (or fight over) the httpx this package uses for homeCore.
    "anthropic>=2.0,<3",
    "jsonschema>=4.0",
    # Plugin mode. Not on any index: uv takes it from the tagged repo (see
    # [tool.uv.sources]); the runtime artifact build bakes it in from a
    # pinned checkout.
    "homecore-plugin-sdk>=0.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
hc-mcp = "hc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["hc_mcp"]

# The chat's screens ship inside the package, where the SDK's ui.find_dir
# looks for them (hc_mcp/ui), so the runtime artifact needs nothing extra.
[tool.hatch.build.targets.wheel.force-include]
"ui" = "hc_mcp/ui"

[tool.uv.sources]
homecore-plugin-sdk = { git = "https://github.com/homeCore-io/hc-plugin-sdk-py", tag = "v0.5.5" }

# Read by hc-scripts/build-python-artifact.sh: what the runtime plugin is.
[tool.homecore]
id = "plugin.mcp"
entrypoint = "hc_mcp.plugin"
category = "Tools"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests carry an explicit @pytest.mark.asyncio; strict mode means a
# forgotten marker fails loudly instead of silently never awaiting.
asyncio_mode = "strict"
